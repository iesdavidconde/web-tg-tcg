<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteos TCG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; margin: 0; }
        .card { border: 2px solid #ffd700; border-radius: 12px; padding: 20px; background: #1e1e1e; max-width: 320px; margin: 0 auto; }
        button { background: #0088cc; color: #fff; border: none; padding: 14px 20px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; }
        button:disabled { background: #555; cursor: not-allowed; }
        #video-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #ffd700; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #result-msg { margin-top: 15px; font-weight: bold; color: #ffd700; }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="user-title">Entrenador TCG</h2>
        <p id="claim-info">Cargando datos...</p>
        <button id="claim-btn" onclick="checkAndClaim()">🎁 Reclamar Puntos</button>
        <p id="result-msg"></p>
    </div>

    <div id="video-modal">
        <div class="spinner"></div>
        <h3>📺 Reproduciendo Anuncio...</h3>
        <p>Financiando el sorteo. Espera <span id="timer">5</span>s</p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const claims = parseInt(urlParams.get('claims') || '0', 10);
        const secureInitData = tg.initData;

        const userTitle = document.getElementById('user-title');
        const claimInfo = document.getElementById('claim-info');
        const claimBtn = document.getElementById('claim-btn');
        const resultMsg = document.getElementById('result-msg');

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userTitle.innerText = `¡Hola, ${tg.initDataUnsafe.user.first_name}!`;
        }

        if (claims === 0) {
            claimInfo.innerText = "✨ Tirada 1 de hoy: ¡GRATIS! (Sin anuncio)";
        } else if (claims < 5) {
            claimInfo.innerText = `📺 Tirada ${claims + 1} de 5: Requiere ver anuncio.`;
        } else {
            claimInfo.innerText = "⚠️ Has agotado tus 5 tiradas de hoy. ¡Vuelve mañana!";
            claimBtn.disabled = true;
        }

        function checkAndClaim() {
            claimBtn.disabled = true;
            if (claims === 0) {
                sendClaimRequest();
            } else {
                showVideoAd(() => {
                    sendClaimRequest();
                });
            }
        }

        function sendClaimRequest() {
            resultMsg.innerText = "Reclamando puntos...";
            
            fetch('https://tcg-je3j.onrender.com/api/claim', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ initData: secureInitData })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    resultMsg.innerText = `🎉 ¡Ganaste ${data.earned} puntos!\nPulsa 'Actualizar Saldo' en el bot.`;
                    if (tg.HapticFeedback) {
                        tg.HapticFeedback.notificationOccurred('success');
                    }
                    setTimeout(() => tg.close(), 3500);
                } else {
                    resultMsg.innerText = data.message;
                }
            })
            .catch(error => {
                resultMsg.innerText = "Error al conectar con el servidor.";
                claimBtn.disabled = false;
            });
        }

        function showVideoAd(callback) {
            const modal = document.getElementById('video-modal');
            const timerEl = document.getElementById('timer');
            let timeLeft = 5;
            
            modal.style.display = 'flex';
            timerEl.innerText = timeLeft;

            const interval = setInterval(() => {
                timeLeft--;
                timerEl.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    modal.style.display = 'none';
                    callback();
                }
            }, 1000);
        }
    </script>
</body>
</html>
