<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCG Rewards</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Adsgram SDK Oficial -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #18222d;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: #212d3b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            width: 85%;
            max-width: 320px;
        }
        h2 { margin-top: 0; color: #64b5f6; }
        p { color: #b0bec5; font-size: 14px; }
        button {
            background-color: #248bda;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: background 0.2s;
        }
        button:disabled { background-color: #546e7a; cursor: not-allowed; }
        #result { margin-top: 15px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🎁 Recompensa TCG</h2>
        <p id="card-desc">Cargando...</p>
        <button id="claim-btn" onclick="handleClaim()">Cargando...</button>
        <div id="result"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const BACKEND_URL = "https://tcg-production-4524.up.railway.app/api/claim";
        
        // Lee el número de tiradas desde la URL que envía el bot Python
        const urlParams = new URLSearchParams(window.location.search);
        const claims = parseInt(urlParams.get('claims') || '0', 10);
        
        let AdController = null;

        // Adapta la interfaz dependiendo de si es la tirada gratuita
        window.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('claim-btn');
            const desc = document.getElementById('card-desc');

            if (claims === 0) {
                desc.innerText = "¡Tu primera tirada de hoy es GRATIS! Gana entre 10 y 100 puntos.";
                btn.innerText = "🎁 Reclamar Gratis";
            } else {
                desc.innerText = "Mira un breve anuncio para ganar puntos extra para el sorteo.";
                btn.innerText = "🎬 Ver Anuncio y Ganar";
            }
        });

        async function handleClaim() {
            const btn = document.getElementById('claim-btn');
            const resultDiv = document.getElementById('result');
            
            // ESCUDO: Comprobar si Telegram ha cargado los datos ANTES de hacer nada
            if (!tg.initData) {
                resultDiv.style.color = "#ff5252";
                resultDiv.innerText = "Error local: Telegram no ha cargado tu sesión. Cierra la Mini App y ábrela usando SOLO el botón del menú.";
                return;
            }
            
            btn.disabled = true;
            resultDiv.style.color = "#ffffff";
            
            if (claims === 0) {
                resultDiv.innerText = "Reclamando tu tirada gratis...";
            } else {
                resultDiv.innerText = "Cargando anuncio...";

                if (!window.Adsgram) {
                    resultDiv.style.color = "#ff5252";
                    resultDiv.innerText = "No se pudo cargar el anuncio.";
                    btn.disabled = false;
                    return;
                }

                if (!AdController) {
                    try {
                        AdController = window.Adsgram.init({ blockId: "43141" });
                    } catch (err) {
                        resultDiv.style.color = "#ff5252";
                        resultDiv.innerText = "Error al iniciar el anuncio.";
                        btn.disabled = false;
                        return;
                    }
                }

                try {
                    await AdController.show();
                    resultDiv.innerText = "¡Anuncio completado! Entregando puntos...";
                } catch (error) {
                    resultDiv.style.color = "#ff5252";
                    resultDiv.innerText = "⚠️ Debes ver el anuncio completo.";
                    btn.disabled = false;
                    return;
                }
            }

            try {
                const response = await fetch(BACKEND_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ initData: tg.initData })
                });

                const data = await response.json();

                if (data.status === "success") {
                    resultDiv.style.color = "#69f0ae";
                    resultDiv.innerText = `🎉 ¡Ganaste ${data.earned} pts! Total: ${data.new_points} pts.`;
                    setTimeout(() => tg.close(), 2500);
                } else if (data.status === "limit_reached") {
                    resultDiv.style.color = "#ffd740";
                    resultDiv.innerText = "⚠️ Límite de 5 tiradas alcanzado hoy.";
                } else {
                    resultDiv.style.color = "#ff5252";
                    resultDiv.innerText = "❌ Error: " + (data.message || "No procesado.");
                    btn.disabled = false;
                }
            } catch (error) {
                resultDiv.style.color = "#ff5252";
                resultDiv.innerText = "❌ Error al conectar con el servidor.";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
