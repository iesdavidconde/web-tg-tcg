<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCG Rewards</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Adsgram SDK Oficial (CORREGIDO) -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #18222d;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: #212d3b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            width: 85%;
            max-width: 320px;
        }
        h2 { margin-top: 0; color: #64b5f6; }
        p { color: #b0bec5; font-size: 14px; }
        button {
            background-color: #248bda;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: background 0.2s;
        }
        button:disabled { background-color: #546e7a; cursor: not-allowed; }
        #result { margin-top: 15px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🎁 Recompensa TCG</h2>
        <p>Mira un breve anuncio para ganar entre 10 y 100 puntos para el sorteo.</p>
        <button id="claim-btn" onclick="handleClaim()">🎬 Ver Anuncio y Ganar</button>
        <div id="result"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const BACKEND_URL = "https://tcg-je3j.onrender.com/api/claim";
        
        // Guardar el controlador globalmente
        let AdController = null;

        async function handleClaim() {
            const btn = document.getElementById('claim-btn');
            const resultDiv = document.getElementById('result');
            
            btn.disabled = true;
            resultDiv.style.color = "#ffffff";
            resultDiv.innerText = "Cargando anuncio...";

            // 1. Verificar si el script oficial cargó
            if (!window.Adsgram) {
                resultDiv.style.color = "#ff5252";
                resultDiv.innerText = "No se pudo cargar el anuncio. Revisa tu conexión.";
                btn.disabled = false;
                return;
            }

            // 2. Inicializar Adsgram solo la primera vez que se pulsa el botón
            if (!AdController) {
                try {
                    AdController = window.Adsgram.init({ blockId: "45566" });
                } catch (err) {
                    resultDiv.style.color = "#ff5252";
                    resultDiv.innerText = "Error al iniciar el bloque de anuncios.";
                    btn.disabled = false;
                    return;
                }
            }

            try {
                // 3. Mostrar el anuncio
                await AdController.show();
                
                resultDiv.innerText = "¡Anuncio completado! Entregando puntos...";
                
                // 4. Conectar con el backend en Render
                const response = await fetch(BACKEND_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ initData: tg.initData })
                });

                const data = await response.json();

                if (data.status === "success") {
                    resultDiv.style.color = "#69f0ae";
                    resultDiv.innerText = `🎉 ¡Ganaste ${data.earned} pts! Total: ${data.new_points} pts.`;
                    setTimeout(() => tg.close(), 2500);
                } else if (data.status === "limit_reached") {
                    resultDiv.style.color = "#ffd740";
                    resultDiv.innerText = "⚠️ Ya alcanzaste el límite de 5 tiradas de hoy.";
                } else {
                    resultDiv.style.color = "#ff5252";
                    resultDiv.innerText = "❌ Error: " + (data.message || "No se pudo procesar.");
                    btn.disabled = false;
                }

            } catch (error) {
                // Si el usuario cierra el vídeo a la mitad
                resultDiv.style.color = "#ff5252";
                resultDiv.innerText = "⚠️ Debes ver el anuncio completo para recibir los puntos.";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
